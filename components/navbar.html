<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/icon.png?v=2" />
    <title>Site navigation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="navbar.css" />
  </head>
  <body class="navbar-component">
    <div class="welcome-strip text-center text-white">
      Your journey begins with Sparrow Flights.
      <a
        class="text-white text-decoration-underline ms-2"
        href="../index.html#booking"
        target="_parent"
        >Find your next flight</a
      >
    </div>
    <header class="travel-header bg-white sticky-top shadow-sm">
      <div
        class="container d-flex align-items-center gap-3 flex-wrap flex-lg-nowrap"
      >
        <a
          href="../index.html"
          class="brand logo-brand me-lg-4"
          aria-label="Sparrow Flights home"
          target="_parent"
        >
          <img
            class="brand-logo-image"
            src="../images/logo.jpeg"
            alt="Sparrow Flights"
          />
        </a>
        <nav
          class="travel-nav d-flex align-self-stretch gap-4 me-auto"
          aria-label="Travel services"
        >
          <a
            class="nav-service is-current"
            data-service="flights"
            href="../index.html#booking"
            target="_parent"
            ><i class="bi bi-airplane" aria-hidden="true"></i
            ><span>Flights</span></a
          >
          <a class="nav-service" data-service="umrah" href="../index.html#booking" target="_parent"
            ><i class="bi bi-moon-stars" aria-hidden="true"></i
            ><span>Umrah</span></a
          >
          <a class="nav-service" data-service="visa" href="../index.html#booking" target="_parent"
            ><i class="bi bi-passport" aria-hidden="true"></i
            ><span>Visa</span></a
          >
        </nav>
        <a
          class="header-action d-none d-lg-flex"
          href="../index.html#contact"
          target="_parent"
          ><i class="bi bi-suitcase fs-4 text-primary" aria-hidden="true"></i
          ><span
            ><strong>My trips</strong><small>Manage your bookings</small></span
          ></a
        >
        <a
          class="header-action wishlist d-none d-xl-flex"
          href="../index.html#offers"
          target="_parent"
          ><i class="bi bi-heart-fill fs-4 text-danger" aria-hidden="true"></i
          ><span
            ><strong>Wishlist</strong><small>Save your favourites</small></span
          ></a
        >
        <a
          class="account-action position-relative ms-2"
          href="../index.html#contact"
          target="_parent"
          aria-label="My account"
        >
          <img src="../images/demo-profile.jpg" alt="" width="40" height="40" />
          <span class="d-none d-md-block"
            ><strong>My account</strong><small>Ali Ahmed</small></span
          >
          <i class="bi bi-chevron-down ms-1" aria-hidden="true"></i>
        </a>
      </div>
    </header>
    <script src="navbar.js"></script>
  </body>
</html>
