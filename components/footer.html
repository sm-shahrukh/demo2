<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/icon.png?v=2" />
    <title>Site footer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="footer.css" />
  </head>
  <body class="footer-component">
    <footer id="contact">
      <div class="container footer-grid d-grid gap-4 py-4">
        <div id="about">
          <a
            href="../index.html"
            class="brand logo-brand footer-logo-brand"
            aria-label="Sparrow Flights home"
            target="_parent"
          >
            <img
              class="brand-logo-image"
              src="../images/logo.jpeg"
              alt="Sparrow Flights"
            />
          </a>
          <p>Journeys for a brighter tomorrow.</p>
        </div>
        <div>
          <h4>About</h4>
          <a href="../index.html#about" target="_parent">Our story</a
          ><a href="../index.html#about" target="_parent">Careers</a
          ><a href="../index.html#destinations" target="_parent">Media</a>
        </div>
        <div>
          <h4>Contact</h4>
          <a href="../index.html#contact" target="_parent">Get in touch</a
          ><a href="../index.html#contact" target="_parent">Branch locations</a
          ><a href="../index.html#contact" target="_parent">Feedback</a>
        </div>
        <div>
          <h4>Support</h4>
          <a href="../index.html#contact" target="_parent">Help centre</a
          ><a href="../index.html#contact" target="_parent"
            >Change or cancel booking</a
          ><a href="../index.html#contact" target="_parent"
            >Baggage information</a
          >
        </div>
        <div>
          <h4>Follow us</h4>
          <div class="socials d-flex gap-3 fs-5">
            <a href="#contact" aria-label="Facebook"
              ><i class="bi bi-facebook"></i></a
            ><a href="#contact" aria-label="Instagram"
              ><i class="bi bi-instagram"></i></a
            ><a href="#contact" aria-label="YouTube"
              ><i class="bi bi-youtube"></i></a
            ><a href="#contact" aria-label="LinkedIn"
              ><i class="bi bi-linkedin"></i
            ></a>
          </div>
        </div>
      </div>
      <div class="container footer-bottom">
        <span>&copy; 2026 Sparrow Flights. The calm journey.</span
        ><span>Static preview &middot; Illustrative offers and fares.</span>
      </div>
    </footer>
