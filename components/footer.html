<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/icon.png?v=2" />
    <title>Site footer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="footer.css" />
  </head>
  <body class="footer-component">
    <footer id="contact">
      <div class="footer-panel">
        <div class="container footer-grid">
          <div id="about">
            <a
              href="../index.html"
              class="brand logo-brand footer-logo-brand"
              aria-label="Sparrow Flights home"
              target="_parent"
            >
              <img
                class="brand-logo-image"
                src="../images/logo.jpeg"
                alt="Sparrow Flights"
              />
            </a>
            <p>Journeys for a brighter tomorrow.</p>
          </div>
          <div>
            <h4>Useful links</h4>
            <a href="../search-flight.html" target="_parent">Search flights</a>
            <a href="../my-bookings.html" target="_parent">My bookings</a>
            <a href="../account-pages/help-support.html" target="_parent">Help centre</a>
            <a href="../about-us.html" target="_parent">About us</a>
          </div>
          <div>
            <h4>Follow us</h4>
            <div class="socials">
              <a href="../contact-us.html" target="_parent" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
              <a href="../contact-us.html" target="_parent" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
              <a href="../contact-us.html" target="_parent" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
              <a href="../contact-us.html" target="_parent" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
            </div>
          </div>
          <div>
            <h4>Subscribe to our newsletter</h4>
            <form class="newsletter-form" action="#" onsubmit="return false">
              <label class="visually-hidden" for="footer-newsletter-email">Your email address</label>
              <input id="footer-newsletter-email" type="email" placeholder="Your email address" />
              <button type="button">Subscribe</button>
            </form>
          </div>
        </div>
        <div class="container footer-bottom">
          <span>&copy; 2026 Sparrow Flights. The calm journey.</span>
          <span>Static preview &middot; Illustrative offers and fares.</span>
        </div>
      </div>
    </footer>
    <script>
      (() => {
        const footer = document.querySelector(".footer-component footer");
        const frame = window.frameElement;
        if (!footer || !frame) return;

        const fitFooter = () => {
          frame.style.height = `${Math.ceil(footer.getBoundingClientRect().height)}px`;
        };

        fitFooter();
        if ("ResizeObserver" in window) new ResizeObserver(fitFooter).observe(footer);
        window.addEventListener("load", fitFooter, { once: true });
      })();
    </script>
  </body>
</html>
