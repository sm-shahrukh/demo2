<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="images/icon.png?v=2" />
    <meta
      name="description"
      content="Discover a calmer journey from Islamabad to Dubai with Sparrow Flights."
    />
    <title>My bookings | Sparrow Flights</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/theme.css" />
    
    
    <link rel="stylesheet" href="css/my-bookings.css" />
    
    
    
    
    
    
    
    
    
      
    
    
    
    
    
    
    
    
    
    
    
    
  </head>
  <body class="my-bookings-page" data-page="my-bookings" data-mobile-nav>
    <iframe
      class="shared-navbar-frame static-navbar"
      src="components/navbar.html"
      title="Site navigation"
      scrolling="no"
    ></iframe>
    <main class="my-bookings-content">
      <div
        class="popup my-bookings-card rounded-4 border shadow-lg"
        id="my-trips"
        aria-labelledby="trips-heading"
      >
        <div
          class="popup-head d-flex justify-content-between align-items-center border-bottom p-4"
        >
          <h2 id="trips-heading">My trips</h2>
          <a
            href="index.html"
            class="my-bookings-close"
            aria-label="Back to home"
            >×</a
          >
        </div>
        <div class="p-4 text-center">
          <i class="bi bi-suitcase fs-2"></i>
          <p class="mt-3">Your upcoming journeys will appear here.</p>
          <small class="text-secondary"
            >Trip management will be available when booking services are
            connected.</small
          >
        </div>
      </div>
    </main>
    <iframe
      class="shared-footer-frame"
      id="contact"
      src="components/footer.html"
      title="Site footer"
      width="100%"
      scrolling="no"
      loading="lazy"
      style="display: block; border: 0"
    ></iframe>

    <iframe
      class="shared-bottom-nav-frame"
      src="components/mobile-navigation.html#nav-trips"
      title="Mobile navigation"
      scrolling="no"
    ></iframe>

    <script>
      (() => {
        const frame = [...document.querySelectorAll("iframe")].find((iframe) =>
          (iframe.getAttribute("src") || "").includes("navbar.html"),
        );
        if (!frame) return;

        const expandedStyles = {
          position: "fixed",
          inset: "0",
          width: "100vw",
          height: "100dvh",
          "max-height": "100dvh",
          "z-index": "10000",
          border: "0",
        };

        let headerObserver;
        let syncFrame = () => {};
        const bindDrawer = () => {
          const doc = frame.contentDocument;
          const header = doc?.querySelector(".travel-header");
          const drawer = doc?.getElementById("mobile-auth-drawer");
          if (!header || !drawer || drawer.dataset.frameResizeBound) return;
          drawer.dataset.frameResizeBound = "true";

          const sizeHeader = () => {
            const height = Math.ceil(header.getBoundingClientRect().bottom);
            document.documentElement.style.setProperty(
              "--site-header-height",
              `${height}px`,
            );
            if (!drawer.matches(":popover-open"))
              frame.style.height = `${height}px`;
          };
          const collapseFrame = () => {
            document.body.classList.remove("site-menu-open");
            Object.keys(expandedStyles).forEach((name) =>
              frame.style.removeProperty(name),
            );
            sizeHeader();
          };
          syncFrame = () => {
            const open =
              matchMedia("(max-width: 767px)").matches &&
              drawer.matches(":popover-open");
            doc
              .querySelector(".mobile-auth-menu-trigger")
              ?.setAttribute("aria-expanded", String(open));
            if (open) {
              document.body.classList.add("site-menu-open");
              Object.entries(expandedStyles).forEach(([name, value]) =>
                frame.style.setProperty(name, value, "important"),
              );
            } else {
              if (drawer.matches(":popover-open")) drawer.hidePopover();
              collapseFrame();
            }
          };

          headerObserver?.disconnect();
          headerObserver = new ResizeObserver(sizeHeader);
          headerObserver.observe(header);
          const strip = doc.querySelector(".welcome-strip");
          if (strip) headerObserver.observe(strip);
          sizeHeader();
          drawer.addEventListener("toggle", syncFrame);
          doc.addEventListener("click", (event) => {
            const link = event.target.closest('a[target="_top"][href]');
            if (link && drawer.contains(link)) {
              event.preventDefault();
              if (drawer.matches(":popover-open")) drawer.hidePopover();
              collapseFrame();
              window.location.assign(link.href);
              return;
            }
            if (event.target.closest('[popovertarget="mobile-auth-drawer"]')) {
              requestAnimationFrame(syncFrame);
            }
          });
          doc.addEventListener("keydown", (event) => {
            if (event.key === "Escape") setTimeout(syncFrame);
          });
        };

        frame.addEventListener("load", bindDrawer);
        window.addEventListener("resize", () => syncFrame());
        bindDrawer();
      })();
    </script>
  </body>
</html>
