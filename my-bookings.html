<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="images/icon.png?v=2" />
    <meta
      name="description"
      content="Discover a calmer journey from Islamabad to Dubai with Sparrow Flights."
    />
    <title>My bookings | Sparrow Flights</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="components/navbar.css" />
    <link rel="stylesheet" href="css/my-bookings.css" />
    <link rel="stylesheet" href="components/footer.css" media="not all" />
    <link rel="stylesheet" href="css/add-ons.css" media="not all" />
    <link rel="stylesheet" href="css/auth.css" media="not all" />
    <link
      rel="stylesheet"
      href="css/booking-confirmation.css"
      media="not all"
    />
    <link rel="stylesheet" href="css/flight-booking.css" media="not all" />
    <link rel="stylesheet" href="css/multi-city.css" media="not all" />
    <link rel="stylesheet" href="css/payment.css" media="not all" />
    <link rel="stylesheet" href="css/search-flight.css" media="not all" />
    <link rel="stylesheet" href="css/travellers.css" media="not all" />
  </head>
  <body class="my-bookings-page" data-page="my-bookings" data-mobile-nav>
    <iframe
      class="shared-navbar-frame static-navbar"
      src="components/navbar.html"
      title="Site navigation"
      scrolling="no"
    ></iframe>
    <main class="my-bookings-content">
      <div
        class="popup my-bookings-card rounded-4 border shadow-lg"
        id="my-trips"
        aria-labelledby="trips-heading"
      >
        <div
          class="popup-head d-flex justify-content-between align-items-center border-bottom p-4"
        >
          <h2 id="trips-heading">My trips</h2>
          <a
            href="index.html"
            class="my-bookings-close"
            aria-label="Back to home"
            >×</a
          >
        </div>
        <div class="p-4 text-center">
          <i class="bi bi-suitcase fs-2"></i>
          <p class="mt-3">Your upcoming journeys will appear here.</p>
          <small class="text-secondary"
            >Trip management will be available when booking services are
            connected.</small
          >
        </div>
      </div>
    </main>
    <iframe
      class="shared-footer-frame"
      id="contact"
      src="components/footer.html"
      title="Site footer"
      width="100%"
      scrolling="no"
      loading="lazy"
      style="display: block; border: 0"
    ></iframe>

    <iframe
      class="shared-bottom-nav-frame"
      src="components/mobile-navigation.html#nav-trips"
      title="Mobile navigation"
      scrolling="no"
    ></iframe>
    <script src="components/navbar-embed.js" defer></script>
  </body>
</html>
